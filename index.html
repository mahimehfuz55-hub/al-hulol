    <style>
      /* ── Base ── */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      ::selection { background: #D4AF37; color: #050C1A; }
      html { font-size: 16px; }
      body { background: #050C1A; color: #F8F9FA; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }

      /* ── Custom Scrollbar ── */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0A1628; }
      ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }

      /* ── Glassmorphism Utilities ── */
      .glass {
        background: rgba(10, 22, 40, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(212, 175, 55, 0.15);
      }
      .glass-strong {
        background: rgba(10, 22, 40, 0.85);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(212, 175, 55, 0.25);
      }
      .glass-card {
        background: linear-gradient(135deg, rgba(212,175,55,0.05) 0%, rgba(10,22,40,0.8) 100%);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(212,175,55,0.12);
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .glass-card:hover {
        background: linear-gradient(135deg, rgba(212,175,55,0.12) 0%, rgba(15,31,58,0.9) 100%);
        border-color: rgba(212,175,55,0.4);
        transform: translateY(-6px);
        box-shadow: 0 20px 60px rgba(212,175,55,0.1);
      }

      /* ── Kinetic Heading Reveal ── */
      .kinetic-heading {
        opacity: 0;
        transform: translateY(50px) rotateX(15deg);
        transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .kinetic-heading.revealed {
        opacity: 1;
        transform: translateY(0) rotateX(0deg);
      }

      /* ── Stagger children ── */
      .stagger-child {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .stagger-child.revealed {
        opacity: 1;
        transform: translateY(0);
      }

      /* ── Gold gradient text ── */
      .gold-text {
        background: linear-gradient(135deg, #D4AF37 0%, #F0D060 50%, #D4AF37 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ── Shimmer effect ── */
      .shimmer-line {
        background: linear-gradient(90deg, transparent, rgba(212,175,55,0.4), transparent);
        background-size: 200% 100%;
        animation: shimmer 2.5s ease-in-out infinite;
      }

      /* ── Marquee strip ── */
      .marquee-track {
        display: flex;
        width: max-content;
        animation: marquee 45s linear infinite;
      }
      .marquee-track-reverse {
        display: flex;
        width: max-content;
        animation: marqueeReverse 50s linear infinite;
      }

      /* ── SVG line-draw ── */
      .draw-line {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        transition: stroke-dashoffset 2s ease-out;
      }
      .draw-line.revealed {
        stroke-dashoffset: 0;
      }

      /* ── Particle canvas ── */
      #particles {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      /* ── Nav ── */
      .nav-link {
        position: relative;
        overflow: hidden;
      }
      .nav-link::after {
        content: '';
        position: absolute;
        bottom: -2px; left: 50%;
        width: 0; height: 2px;
        background: #D4AF37;
        transition: all 0.3s ease;
        transform: translateX(-50%);
      }
      .nav-link:hover::after { width: 100%; }
      .nav-link:hover { color: #D4AF37; }

      /* ── Dashboard ── */
      .dashboard-sidebar {
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .chat-msg {
        animation: slideIn 0.4s ease-out forwards;
      }

      /* ── Progress Ring ── */
      .progress-ring-circle {
        transition: stroke-dashoffset 1.5s ease-out;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }

      /* ── Security Badge Pulse ── */
      .security-pulse {
        animation: pulseGold 2s ease-in-out infinite;
      }

      /* ── Hero parallax layers ── */
      .parallax-layer {
        transition: transform 0.1s ease-out;
      }

      /* ── Tooltip ── */
      [data-tooltip]:hover::before {
        content: attr(data-tooltip);
        position: absolute;
        bottom: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        background: #0A1628;
        color: #D4AF37;
        padding: 4px 12px;
        border-radius: 6px;
        font-size: 0.75rem;
        border: 1px solid rgba(212,175,55,0.3);
        white-space: nowrap;
        z-index: 50;
      }

      /* ── Loading overlay ── */
      #loader {
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #loader.hidden {
        opacity: 0;
        visibility: hidden;
      }

      /* ── Tab indicator ── */
      .tab-btn.active-tab {
        background: rgba(212,175,55,0.15);
        color: #D4AF37;
        border-color: #D4AF37;
      }

      /* ── Document vault item ── */
      .vault-item {
        transition: all 0.3s ease;
      }
      .vault-item:hover {
        background: rgba(212,175,55,0.08);
      }

      /* ── Responsive adjustments ── */
      @media (max-width: 768px) {
        .mobile-menu { transform: translateX(100%); }
        .mobile-menu.open { transform: translateX(0); }
      }
    </style>
  </head>
